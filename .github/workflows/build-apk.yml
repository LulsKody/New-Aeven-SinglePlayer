name: Build EO Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat payload/chunk00.txt payload/chunk01.txt payload/chunk02.txt | base64 --decode > project.tar.gz
          tar -xzf project.tar.gz
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOAndroidClient-Test-0.1.0-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/EOAndroidClient-Test-0.1.0-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk.sha256 artifacts/EOAndroidClient-Test-0.1.0-debug.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish EO Android test APK [skip ci]'
          git push
